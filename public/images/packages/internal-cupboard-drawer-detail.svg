<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-hidden="true">
  <style>
    .psc-badge { animation: psc-pulse 2.6s ease-in-out infinite; transform-origin: 32px 32px; }
    .psc-spark { animation: psc-twinkle 1.8s ease-in-out infinite; transform-origin: 50px 14px; }
    @keyframes psc-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes psc-twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#F4F5F7"/>
  <g class="psc-badge" fill="none" stroke="#B89642" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="14" width="32" height="36" rx="3"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="30" y1="24" x2="34" y2="24"/>
    <line x1="30" y1="42" x2="34" y2="42"/>
  </g>
  <circle class="psc-spark" cx="50" cy="14" r="2.2" fill="#B89642"/>
</svg>
